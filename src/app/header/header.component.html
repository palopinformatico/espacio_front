<div class="header-container">
  <div class="header-content">
    <!-- Logo -->
    <div class="logo-section">
      <button (click)="navigateToHome()" class="logo-button" type="button">
        <img src="/logo.png" alt="Boulevard Linares Logo" class="logo-img">
      </button>
      <div class="contact-info" style="display: flex; flex-direction: column; gap: 0.25rem;">
        <div class="contact-address" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; font-weight: 500; color: #ffffff; letter-spacing: 0.3px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);">Independencia 761, Linares</div>
        <div class="contact-phone" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 1.1rem; font-weight: 500; color: #ffffff; letter-spacing: 0.3px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); opacity: 0.9; display: flex; align-items: center; gap: 0.5rem;">
          <i class="bi bi-telephone"></i>
          <span>/</span>
          <i class="bi bi-whatsapp"></i>
          <span>Tel: +56 9 7253 1521</span>
        </div>
      </div>
    </div>

    <!-- User Profile -->
    <div class="user-profile" *ngIf="currentUser && currentUser.id">
      <div class="user-info-wrapper">
        <!-- User Avatar -->
        <div class="avatar-container">
          <img [src]="userImage" [alt]="userName" class="user-avatar">
          <div class="status-indicator"></div>
        </div>

        <!-- User Details -->
        <div class="user-details">
          <div class="user-name">{{ userName }}</div>
          <div class="user-role">
            <span class="role-badge">{{ currentUser?.role || currentUser?.tipo_usuario}}</span>
          </div>
        </div>

        <!-- Logout Button -->
        <button class="logout-btn" (click)="logout()" title="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>

    <!-- Fallback if no user -->
    <div class="user-profile" *ngIf="!currentUser">
      <button class="btn btn-logout naranja" (click)="goToLogin()">
        <i class="bi bi-lock-fill me-2"></i>
        <strong>Restringida</strong>
      </button>
    </div>
  </div>
</div>
